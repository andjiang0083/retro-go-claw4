# .github/workflows/build-claw4.yml — Claw4(方屏 720×720) 构建回归门禁
#
# 为什么单独一条：main 的 build.yml 守的是 tab5，**不能直接搬过来用**——
#   - `branches: [main]`：搬到 claw4 上根本不会触发；
#   - 锚点不同：tab5 查 E9/AA50/ABCD5432+≥512KB，claw4 查 **三点 flash-size nibble**；
#   - target/产物名不同：tab5 → retro-go_*_tab5.img，claw4 → retro-go_*_claw4.img。
# 本文件只加不改：main 的 build.yml 与主干内容零触碰（两线无共同祖先，反向合并会连
# CI/社区文档一起删掉，见 claw4 收口记录）。
#
# 职责（只有这三件）：
#   1) 干净克隆 + claw4 全量构建能成功（--no-networking：P4 无射频，增量会掩盖配置错）
#   2) merged 镜像结构门禁：三点 flash-size nibble 一致 **且等于 targets/claw4/sdkconfig
#      声明容量推导值**（Claw4=32MB ⇒ nibble=5）+ @0x8000 aa50
#   3) 产物与哈希留痕（artifact）
# 不做：帧率/显示通路/崩溃验证（无硬件，靠真机看屏 + SD 卡 /crash.log）；不做发布。
# 禁止：continue-on-error / 跳过步骤 / 放宽门禁换绿。
#
# ★ nibble 绝不硬编码（本仓真实事故）：门禁曾写死 nibble==4(16MB)，
#   结果把正确的 32MB 镜像判成不合格、反过来放过错的。已发布件实测：
#     v0.4.12.bin → nibble=5 ✅   v0.4.11.bin / v0.4.9-25-g9343a.bin → nibble=4 ❌
#   期望值一律从唯一真源 targets/claw4/sdkconfig 的 CONFIG_ESPTOOLPY_FLASHSIZE 推导。
#   （与 tools/release-claw4.sh 第④步三点门禁同一套判据，勿在此另立标准。）
#
# 沿用 main 已实测的踩坑经验（原文见 build.yml）：checkout 必须带 tag，否则
# rg_tool.py 的 `git describe --tags` 退化成裸 hash ⇒ 镜像名读不到版本号；
# install-esp-idf-action 只导出 IDF_PATH+工具链，**不铺 IDF 自己的脚本目录**
# （run #2 死在 Packing：`No such file or directory: 'gen_esp32part.py'`）。

name: build-claw4

on:
  push:
    branches: [claw4]
  pull_request:
    branches: [claw4]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: build-claw4-${{ github.ref }}
  cancel-in-progress: false

env:
  # 与开发树 tools/idf-env.sh（~/esp/esp-idf-v5.5 = 5.5.2）一致；
  # patch 号由第 2 步直接读 version.cmake 断言，不依赖间接信号。
  IDF_VERSION: "v5.5.2"

jobs:
  build-claw4:
    name: Build + structure gate (Claw4)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ESP-IDF ${{ env.IDF_VERSION }}
        uses: espressif/install-esp-idf-action@v1
        with:
          version: ${{ env.IDF_VERSION }}

      - name: Assert ESP-IDF environment
        run: |
          set -euo pipefail
          [ -n "${IDF_PATH:-}" ] || { echo "::error::IDF_PATH 未被导出（action 行为变了）"; exit 1; }
          echo "IDF_PATH=$IDF_PATH"
          [ -x "$IDF_PATH/tools/idf.py" ] || { echo "::error::$IDF_PATH/tools/idf.py 不存在"; exit 1; }
          PATCH=$(sed -n 's/.*set(IDF_VERSION_PATCH \([0-9]*\)).*/\1/p' "$IDF_PATH/tools/cmake/version.cmake")
          [ "$PATCH" = "2" ] || { echo "::error::期望 IDF 5.5.2，实际 patch=$PATCH"; exit 1; }
          riscv32-esp-elf-gcc --version | head -n1
          # 补 PATH：rg_tool.py 在非 Windows 上按裸命令名调这些脚本（:52-57）。
          for d in tools components/partition_table components/app_update components/espcoredump; do
            [ -d "$IDF_PATH/$d" ] || { echo "::error::$IDF_PATH/$d 不存在（IDF 布局变了）"; exit 1; }
            echo "$IDF_PATH/$d" >> "$GITHUB_PATH"
          done
          NEWPATH="$IDF_PATH/tools:$IDF_PATH/components/partition_table:$PATH"
          for c in idf.py gen_esp32part.py; do
            PATH="$NEWPATH" command -v "$c" >/dev/null || { echo "::error::$c 不在 PATH —— rg_tool.py 会裸调它"; exit 1; }
          done

      # ── 3. claw4 全量构建（launcher + gbsp 双 app merged，与发布脚本同形态）──
      - name: Build claw4 merged image (launcher + retro-core + gbsp)
        working-directory: retro-go-p4
        run: |
          set -euo pipefail
          rm -f partitions.csv partitions.bin   # 构建期生成物，强制重建（.gitignore 已忽略）
          python3 rg_tool.py --target claw4 --no-networking build-img launcher gbsp retro-core 2>&1 | tee ../build-claw4.log

      # ── 4. 三点门禁（判据与 tools/release-claw4.sh:78-98 一致，内联防漂移副本）──
      - name: Structure gate (claw4 flash-size nibble)
        working-directory: retro-go-p4
        run: |
          set -euo pipefail
          IMG=$(ls retro-go_*_claw4.img 2>/dev/null | head -n1)
          [ -n "$IMG" ] || { echo "::error::没找到 retro-go_*_claw4.img"; ls -la; exit 1; }
          [ -s launcher/build/launcher.bin ] || { echo "::error::launcher.bin 缺失"; exit 1; }
          [ -s gbsp/build/gbsp.bin ] || { echo "::error::gbsp.bin 缺失"; exit 1; }
          [ -s retro-core/build/retro-core.bin ] || { echo "::error::retro-core.bin 缺失"; exit 1; }
          echo "merged image: $IMG ($(stat -c%s "$IMG") bytes)"
          python3 - "$IMG" <<'PYEOF'
          import sys, hashlib, re, csv
          img = sys.argv[1]
          data = open(img,'rb').read()
          def nib(off): return (data[off+3] >> 4) & 0xF
          # 活动 app 槽从**本次生成的 partitions.csv** 取，绝不写死偏移：
          # 槽序由 rg_tool.py 的 PROJECT_APPS 字典序决定（launcher→retro-core→gbsp），
          # 形态一变（加核/换形态）写死的偏移就会指错槽 —— 退化成"零断言 PASS"。
          slots, declared = [], []
          for row in csv.reader(open("partitions.csv")):
              if len(row) >= 5 and row[1].strip() == "app" and row[2].strip().startswith("ota_"):
                  (declared if row[0].strip().endswith("_l") else slots).append(
                      (row[0].strip(), int(row[3].strip())))
          assert slots, "partitions.csv 无活动 app 槽（零断言=门禁空转）"
          assert [s for s, _ in slots] == ["launcher", "retro-core", "gbsp"], \
              f"活动槽形态不符（期望 launcher/retro-core/gbsp）: {[s for s, _ in slots]}"
          offs = [0x2000] + [o for _, o in slots]
          nibs = {hex(o): nib(o) for o in offs}
          assert len(set(nibs.values())) == 1, f"各段 flash-size nibble 不一致: {nibs}"
          assert all(o < len(data) for _, o in slots), "活动槽偏移越界（分区表与镜像不一致）"
          assert all(o >= len(data) for _, o in declared), "声明槽 _l 竟然有数据（镜像被撑大）"
          SC = "components/retro-go/targets/claw4/sdkconfig"   # 唯一真源
          m = re.search(r'CONFIG_ESPTOOLPY_FLASHSIZE="(\d+)MB"', open(SC, encoding='utf-8', errors='replace').read())
          assert m, f"{SC} 未声明 CONFIG_ESPTOOLPY_FLASHSIZE"
          NIB = {"1":0,"2":1,"4":2,"8":3,"16":4,"32":5,"64":6,"128":7}
          exp = NIB[m.group(1)]
          assert set(nibs.values()) == {exp}, f"nibble={nibs}，但 {SC} 声明 {m.group(1)}MB（期望 {exp}）"
          assert data[0x8000:0x8002] == b'\xaa\x50', "分区表 magic @0x8000 缺失"
          assert len(data) >= 1048576, f"镜像过小 {len(data)} B，不像完整 merged 件"
          print(f"OK claw4 nibble={exp}({m.group(1)}MB, {SC}) / aa50 / 槽={[s for s,_ in slots]} "
                f"偏移={[hex(o) for o in offs]} / {len(data)}B / sha256={hashlib.sha256(data).hexdigest()[:12]}")
          PYEOF
          shasum -a 256 "$IMG" | tee ../SHA256SUMS-claw4.txt

      # ── 5. 可移植性门禁：仓库里不许有"只在这台机器成立"的绝对路径 ──
      - name: Portability gate (no machine-local absolute paths)
        run: |
          set -euo pipefail
          # 排除必须用**精确 pathspec**：`:*.gitignore` 不生效（会把自己判成命中，CI run #1 即栽在此）。
          HITS=$(git grep -l '/Users/\|/home/' -- ':!vendor' ':!.github' '!:*.md' ':!.gitignore' || true)
          [ -z "$HITS" ] || { echo "::error::跟踪文件含本机绝对路径："; echo "$HITS"; exit 1; }
          # dependencies.lock 是生成物（记的是生成机绝对路径），必须不被跟踪
          if git ls-files --error-unmatch retro-go-p4/dependencies.lock >/dev/null 2>&1; then
            echo "::error::retro-go-p4/dependencies.lock 被跟踪了（生成物）"; exit 1
          fi
          echo "✓ 无绝对路径 / 无被跟踪的 dependencies.lock"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claw4-build-${{ github.sha }}
          path: |
            retro-go-p4/retro-go_*_claw4.img
            SHA256SUMS-claw4.txt
            build-claw4.log
          if-no-files-found: error
